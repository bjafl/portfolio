    track: tech
    title: Interesse og teft for data
    text: Lærte meg programmering på egen hånd, først VBA og så C#.
  - year: "2009–2012"
    track: tech
    title: Realfag på videregående
    text: Matematikk R2, fysikk 2 og kjemi 2.
  - year: "2013–2015"
    track: tech
    title: Kybernetikk og robotikk, NTNU
    text: IT, kretsteknikk, matematikk 1–3 og tilpassede datasystemer.
  - year: "2015–2016"
    track: people
    title: Profesjonsstudiet i psykologi, NTNU
    text: Klinisk psykologi, metode og statistikk.
  - year: "2017–2022"
    track: tech
    title: Hobbyprosjekter på si
    text: En C#-konverter til Evernote-format, og en feilretting i den åpne notatappen Nomie 5.
  - year: "2017–2022"
    track: people
    title: Sosialt arbeid, UiS
    text: >-
      Bachelor med oppgave om inkludering gjennom IPS. Ved siden av: miljøterapi i psykisk helse, og praksis i
      barnevernet.
  - year: "2022"
    title: "Jobbkonsulent i AFT: sporene møtes"
    text: Regneark, makroer og små skript som sparer tid for meg og kollegene mine.
  - year: "2023–2024"
    title: Verktøy for produksjonen, og kurs for deltakere
    text: >-
      Et verktøy som gjør ordredata fra skiltproduksjonen om til oversiktlige Excel-dokumenter, først i Python, så i
      C#. Kursmateriell i programmering for deltakere i AFT. Høsten 2024: 30 stp IT-ingeniørfag ved UiT, ved siden av
      full jobb.
  - year: "2025"
    title: Nytt fagsystem, og tillegget som fyller hullene
    text: >-
      Datamigrering og konvertering av alle dokumentmalene ved bytte av fagsystem. Første versjon av
      nettlesertillegget på en måned, ved siden av jobben. På fritiden: homely og den første versjonen av e2ee-drop.
    projects: [fagsystem-migrering, fagsystem-tillegg, homely]
  - year: "2026"
    title: Stillas, fullstack med egen drift
    text: >-
      Fagkunnskap, arkitektur og drift i samme plattform. På fritiden: tiny-metamcp, e2ee-drop på nytt, og
      wheel-planner.
    projects: [stillas, tiny-metamcp, e2ee-drop, wheel-planner]
