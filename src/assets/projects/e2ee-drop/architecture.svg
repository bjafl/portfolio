<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" aria-labelledby="e2ee-arch-title e2ee-arch-desc" color="#121a15" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="e2ee-arch-title">e2ee-drop – high-level architecture</title>
  <desc id="e2ee-arch-desc">The sender's browser zips and encrypts the file with nacl.box in a Web Worker; the recipient's browser decrypts locally. Both talk to an nginx web container that serves the app and proxies the API and storage. The Fastify API keeps links, wrapped keys and metadata in PostgreSQL and hands out presigned URLs. MinIO stores ciphertext only. A cleanup job enforces retention. Plaintext files, private keys and the password itself never leave the browsers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Self-contained panel so the image reads the same in light and dark site themes. -->
  <rect x="1" y="1" width="478" height="468" rx="16" fill="#f8f9f7" stroke="#7e8a81" stroke-width="2"/>

  <g stroke="currentColor" stroke-width="1.5" fill="currentColor" text-anchor="middle">
    <!-- Browsers -->
    <rect x="16" y="20" width="216" height="76" rx="12" fill="#e4efe6"/>
    <text x="124" y="44" font-size="17" font-weight="700" stroke="none">Sender's browser</text>
    <text x="124" y="66" font-size="15" stroke="none">zip · nacl.box encrypt</text>
    <text x="124" y="86" font-size="15" stroke="none">in a Web Worker</text>
    <rect x="248" y="20" width="216" height="76" rx="12" fill="#e4efe6"/>
    <text x="356" y="44" font-size="17" font-weight="700" stroke="none">Recipient's browser</text>
    <text x="356" y="66" font-size="15" stroke="none">decrypts locally</text>
    <text x="356" y="86" font-size="15" stroke="none">holds the private key</text>

    <line x1="124" y1="96" x2="124" y2="124" marker-end="url(#arrow)" fill="none"/>
    <line x1="356" y1="96" x2="356" y2="124" marker-end="url(#arrow)" fill="none"/>

    <!-- Web container -->
    <rect x="16" y="126" width="448" height="48" rx="12" fill="none"/>
    <text x="240" y="156" font-size="17" font-weight="700" stroke="none">nginx web container · /api · /s3</text>

    <line x1="124" y1="174" x2="124" y2="202" marker-end="url(#arrow)" fill="none"/>
    <line x1="356" y1="174" x2="356" y2="202" marker-end="url(#arrow)" fill="none"/>

    <!-- API and storage -->
    <rect x="16" y="204" width="216" height="62" rx="12" fill="#e8ede7"/>
    <text x="124" y="230" font-size="17" font-weight="700" stroke="none">Fastify API</text>
    <text x="124" y="252" font-size="15" stroke="none">presigned URLs · sessions</text>
    <rect x="248" y="204" width="216" height="62" rx="12" fill="#d3e6d8"/>
    <text x="356" y="230" font-size="17" font-weight="700" stroke="none">MinIO</text>
    <text x="356" y="252" font-size="15" stroke="none">ciphertext only</text>

    <line x1="124" y1="266" x2="124" y2="296" marker-end="url(#arrow)" fill="none"/>
    <line x1="356" y1="296" x2="356" y2="266" marker-end="url(#arrow)" fill="none"/>
    <line x1="248" y1="327" x2="234" y2="327" marker-end="url(#arrow)" fill="none"/>

    <!-- Database and cleanup -->
    <rect x="16" y="298" width="216" height="62" rx="12" fill="#d3e6d8"/>
    <text x="124" y="324" font-size="17" font-weight="700" stroke="none">PostgreSQL</text>
    <text x="124" y="346" font-size="15" stroke="none">links · wrapped keys</text>
    <rect x="248" y="298" width="216" height="62" rx="12" fill="none" stroke-dasharray="6 4"/>
    <text x="356" y="324" font-size="17" font-weight="700" stroke="none">Cleanup job</text>
    <text x="356" y="346" font-size="15" stroke="none">expiry · retention</text>

    <!-- Boundary -->
    <line x1="16" y1="380" x2="464" y2="380" stroke-dasharray="4 4" fill="none"/>
    <text x="240" y="406" font-size="16" font-weight="700" stroke="none">Never leaves the browsers</text>
    <text x="240" y="430" font-size="15" stroke="none">plaintext files · private keys · the password itself</text>
    <text x="240" y="452" font-size="15" font-style="italic" stroke="none">(the server stores keys only wrapped)</text>
  </g>
</svg>
