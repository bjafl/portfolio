<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 424" width="480" height="424" role="img" aria-labelledby="wp-arch-title wp-arch-desc" color="#2e2620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="wp-arch-title">wheel-planner – high-level architecture</title>
  <desc id="wp-arch-desc">In the browser, an SVG wheel with zoom, pan and drag, and a side panel with forms and a ring list, both read from and write to a Zustand store. The store repacks lanes and saves every change over a fetch client to an Express 5 REST API for wheels, rings and activities, which stores data in SQLite through better-sqlite3. A separate geometry module of pure functions for date and angle conversion, lane packing and recurrence is used by the wheel and the store.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Self-contained panel so the image reads the same in light and dark site themes. -->
  <rect x="1" y="1" width="478" height="422" rx="16" fill="#efe5d3" stroke="#8f7f6a" stroke-width="2"/>

  <g stroke="currentColor" stroke-width="1.5" fill="currentColor" text-anchor="middle">
    <!-- UI -->
    <rect x="16" y="20" width="216" height="64" rx="12" fill="#f6d5bc"/>
    <text x="124" y="46" font-size="17" font-weight="700" stroke="none">SVG wheel</text>
    <text x="124" y="68" font-size="15" stroke="none">zoom · pan · drag</text>
    <rect x="248" y="20" width="216" height="64" rx="12" fill="#f6d5bc"/>
    <text x="356" y="46" font-size="17" font-weight="700" stroke="none">Side panel</text>
    <text x="356" y="68" font-size="15" stroke="none">forms · ring list</text>

    <line x1="124" y1="84" x2="124" y2="110" marker-end="url(#arrow)" fill="none"/>
    <line x1="356" y1="84" x2="356" y2="110" marker-end="url(#arrow)" fill="none"/>

    <!-- Store -->
    <rect x="16" y="112" width="448" height="64" rx="12" fill="#d3e2cb"/>
    <text x="240" y="138" font-size="17" font-weight="700" stroke="none">Zustand store</text>
    <text x="240" y="160" font-size="15" stroke="none">repacks lanes · saves every change</text>

    <line x1="240" y1="176" x2="240" y2="202" marker-end="url(#arrow)" fill="none"/>

    <!-- API -->
    <rect x="16" y="204" width="448" height="64" rx="12" fill="#cfddeb"/>
    <text x="240" y="230" font-size="17" font-weight="700" stroke="none">Express 5 REST API</text>
    <text x="240" y="252" font-size="15" stroke="none">wheels · rings · activities</text>

    <line x1="240" y1="268" x2="240" y2="294" marker-end="url(#arrow)" fill="none"/>

    <!-- DB -->
    <rect x="16" y="296" width="448" height="42" rx="12" fill="none"/>
    <text x="240" y="323" font-size="17" font-weight="700" stroke="none">SQLite (better-sqlite3)</text>

    <!-- Geometry -->
    <rect x="16" y="354" width="448" height="56" rx="12" fill="none" stroke-dasharray="6 4"/>
    <text x="240" y="377" font-size="15" font-weight="700" stroke="none">geometry/ – pure functions, used by wheel and store</text>
    <text x="240" y="398" font-size="15" stroke="none">date↔angle · lane packing · recurrence</text>
  </g>
</svg>
