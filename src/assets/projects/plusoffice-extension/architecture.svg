<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-labelledby="po-ext-arch-title po-ext-arch-desc" color="#2e2620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="po-ext-arch-title">PlusOffice extension – high-level architecture</title>
  <desc id="po-ext-arch-desc">Content scripts run in the external PlusOffice and NAV pages and exchange typed messages with a background service worker and a React side panel, which use chrome.storage and an anonymised IndexedDB store. Release: GitHub Actions builds, tests and signs a CRX, a repository dispatch makes the store repo validate it and open a pull request, Netlify publishes the CRX and update manifest, and installed extensions update themselves.</desc>
  <defs>
    <marker id="po-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Self-contained panel so the image reads the same in light and dark site themes. -->
  <rect x="1" y="1" width="478" height="558" rx="16" fill="#efe5d3" stroke="#8f7f6a" stroke-width="2"/>

  <g stroke="currentColor" stroke-width="1.5" fill="currentColor" text-anchor="middle">
    <!-- External pages -->
    <rect x="16" y="20" width="448" height="56" rx="12" fill="#f6d5bc"/>
    <text x="240" y="44" font-size="17" font-weight="700" stroke="none">PlusOffice · NAV pages</text>
    <text x="240" y="64" font-size="15" stroke="none">external web apps in the browser</text>

    <line x1="240" y1="78" x2="240" y2="108" marker-start="url(#po-arrow)" marker-end="url(#po-arrow)" fill="none"/>

    <!-- Content scripts -->
    <rect x="16" y="110" width="448" height="56" rx="12" fill="none"/>
    <text x="240" y="134" font-size="17" font-weight="700" stroke="none">Content scripts</text>
    <text x="240" y="154" font-size="15" stroke="none">read · fill in · relay calls</text>

    <line x1="124" y1="168" x2="124" y2="198" marker-start="url(#po-arrow)" marker-end="url(#po-arrow)" fill="none"/>
    <text x="136" y="189" font-size="15" font-style="italic" text-anchor="start" stroke="none">typed messages</text>

    <!-- Extension contexts -->
    <rect x="16" y="200" width="200" height="56" rx="12" fill="#cfddeb"/>
    <text x="116" y="224" font-size="17" font-weight="700" stroke="none">Background</text>
    <text x="116" y="244" font-size="15" stroke="none">service worker · state</text>
    <line x1="218" y1="228" x2="262" y2="228" marker-start="url(#po-arrow)" marker-end="url(#po-arrow)" fill="none"/>
    <rect x="264" y="200" width="200" height="56" rx="12" fill="#cfddeb"/>
    <text x="364" y="224" font-size="17" font-weight="700" stroke="none">Side panel</text>
    <text x="364" y="244" font-size="15" stroke="none">React UI · tools</text>

    <line x1="116" y1="256" x2="116" y2="288" marker-end="url(#po-arrow)" fill="none"/>
    <line x1="364" y1="256" x2="364" y2="288" marker-end="url(#po-arrow)" fill="none"/>

    <!-- Storage -->
    <rect x="16" y="290" width="448" height="56" rx="12" fill="#d3e2cb"/>
    <text x="240" y="314" font-size="17" font-weight="700" stroke="none">Storage</text>
    <text x="240" y="334" font-size="15" stroke="none">chrome.storage · IndexedDB (anonymised)</text>

    <!-- Release -->
    <line x1="16" y1="366" x2="464" y2="366" stroke-dasharray="4 4" fill="none"/>
    <text x="240" y="388" font-size="15" font-style="italic" stroke="none">Release (repository_dispatch → store repo)</text>

    <rect x="16" y="400" width="136" height="56" rx="12" fill="none"/>
    <text x="84" y="424" font-size="16" font-weight="700" stroke="none">GitHub Actions</text>
    <text x="84" y="444" font-size="15" stroke="none">test · sign CRX</text>
    <line x1="152" y1="428" x2="174" y2="428" marker-end="url(#po-arrow)" fill="none"/>
    <rect x="176" y="400" width="128" height="56" rx="12" fill="none"/>
    <text x="240" y="424" font-size="16" font-weight="700" stroke="none">Store repo</text>
    <text x="240" y="444" font-size="15" stroke="none">validate · PR</text>
    <line x1="304" y1="428" x2="326" y2="428" marker-end="url(#po-arrow)" fill="none"/>
    <rect x="328" y="400" width="136" height="56" rx="12" fill="none"/>
    <text x="396" y="424" font-size="16" font-weight="700" stroke="none">Netlify</text>
    <text x="396" y="444" font-size="15" stroke="none">CRX · manifest</text>

    <line x1="396" y1="456" x2="396" y2="478" marker-end="url(#po-arrow)" fill="none"/>

    <!-- Auto-update -->
    <rect x="16" y="480" width="448" height="60" rx="12" fill="none" stroke-dasharray="6 4"/>
    <text x="240" y="504" font-size="16" font-weight="700" stroke="none">Installed extensions update themselves</text>
    <text x="240" y="526" font-size="15" stroke="none">Chrome checks the update manifest</text>
  </g>
</svg>
