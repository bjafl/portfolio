<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img" aria-labelledby="tmm-arch-title tmm-arch-desc" color="#121a15" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="tmm-arch-title">tiny-metamcp – high-level architecture</title>
  <desc id="tmm-arch-desc">MCP clients such as Claude connect through a reverse proxy that terminates TLS. Behind it sits the aggregator, built with FastAPI and the Python MCP SDK, which authenticates each request with OAuth 2.1 and PKCE or a personal token, applies per-user access control, and prefixes tool names with the server name. The aggregator starts and supervises child MCP servers installed from PyPI, npm or git, or connects to remote HTTP servers. A web admin UI and a REST API, protected by GitHub or Steam login, manage the servers. The separate mcp-tools repository holds reusable servers that can be started this way.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Self-contained panel so the image reads the same in light and dark site themes. -->
  <rect x="1" y="1" width="478" height="518" rx="16" fill="#f8f9f7" stroke="#7e8a81" stroke-width="2"/>

  <g stroke="currentColor" stroke-width="1.5" fill="currentColor" text-anchor="middle">
    <!-- Clients -->
    <rect x="16" y="20" width="448" height="56" rx="12" fill="#e8ede7"/>
    <text x="240" y="44" font-size="17" font-weight="700" stroke="none">MCP clients</text>
    <text x="240" y="65" font-size="15" stroke="none">Claude web · desktop apps · browser</text>

    <line x1="240" y1="76" x2="240" y2="102" marker-end="url(#arrow)" fill="none"/>

    <!-- Proxy -->
    <rect x="16" y="104" width="448" height="46" rx="12" fill="none"/>
    <text x="240" y="132" font-size="15" stroke="none">Reverse proxy · TLS (Traefik via Coolify)</text>

    <line x1="240" y1="150" x2="240" y2="176" marker-end="url(#arrow)" fill="none"/>

    <!-- Aggregator -->
    <rect x="16" y="178" width="448" height="156" rx="12" fill="#e4efe6"/>
    <text x="240" y="204" font-size="17" font-weight="700" stroke="none">Aggregator (FastAPI + Python MCP SDK)</text>
    <text x="240" y="228" font-size="15" stroke="none">OAuth 2.1 + PKCE  or  personal token</text>
    <text x="240" y="250" font-size="15" stroke="none">per-user access control</text>
    <text x="240" y="272" font-size="15" stroke="none">tools namespaced as server__tool</text>
    <text x="240" y="294" font-size="15" stroke="none">admin UI + REST API</text>
    <text x="240" y="316" font-size="15" stroke="none">(GitHub or Steam login)</text>

    <line x1="240" y1="334" x2="240" y2="360" marker-end="url(#arrow)" fill="none"/>

    <!-- Children -->
    <rect x="16" y="362" width="448" height="94" rx="12" fill="#c9dfcf"/>
    <text x="240" y="388" font-size="17" font-weight="700" stroke="none">Child MCP servers</text>
    <text x="240" y="412" font-size="15" stroke="none">started with uvx (PyPI) · npx (npm) · git</text>
    <text x="240" y="434" font-size="15" stroke="none">or remote HTTP servers (proxied)</text>

    <!-- mcp-tools -->
    <rect x="16" y="470" width="448" height="38" rx="12" fill="none" stroke-dasharray="6 4"/>
    <text x="240" y="495" font-size="15" stroke="none">mcp-tools: reusable servers, run via uvx from git</text>
  </g>
</svg>
